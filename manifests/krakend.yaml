apiVersion: v1
kind: ConfigMap
metadata:
  name: krakend-config
data:
  krakend.json: |
    {
      "version": 4,
      "name": "Carnival Gateway",
      "port": 8080,
      "timeout": "3s",
      "endpoints": [
        {
          "endpoint": "/api/user",
          "method": "GET",
          "backend": [
            {
              "host": ["http://backend-a"],
              "url_pattern": "/user"
            }
          ]
        },
        {
          "endpoint": "/api/orders",
          "method": "GET",
          "backend": [
            {
              "host": ["http://backend-b"],
              "url_pattern": "/orders"
            }
          ]
        },
        {
          "endpoint": "/api/profile",
          "method": "GET",
          "backend": [
            {
              "host": ["http://backend-a"],
              "url_pattern": "/user",
              "group": "user"
            },
            {
              "host": ["http://backend-b"],
              "url_pattern": "/orders"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krakend
  template:
    metadata:
      labels:
        app: krakend
    spec:
      enableServiceLinks: false
      containers:
        - name: krakend
          image: krakend:3.0.0
          args: ["run", "-c", "/etc/krakend/krakend.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/krakend
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: krakend-config
---
apiVersion: v1
kind: Service
metadata:
  name: krakend
spec:
  selector:
    app: krakend
  ports:
    - name: http
      port: 80
      targetPort: http
